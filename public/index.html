<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFKHOST</title><link rel="stylesheet" href="/style.css"><main><header><h1>AFKHOST</h1><button id="logout" hidden>Abmelden</button></header><section id="login"><h2>Login</h2><form id="loginForm"><input name="username" placeholder="Benutzername" required><input name="password" type="password" placeholder="Passwort" required><button>Anmelden</button></form><p id="err"></p></section><section id="panel" hidden><h2 id="identity"></h2><section id="admin" hidden><h3>Benutzer erstellen</h3><form id="userForm"><input name="username" placeholder="Benutzername"><input name="password" type="password" placeholder="Startpasswort (12+ Zeichen)"><input name="bot_limit" type="number" value="1" min="0" max="50"><button>Anlegen</button></form><p id="userMsg"></p><h3>Bot zuweisen</h3><form id="botForm"><input name="owner_id" type="number" placeholder="User-ID"><input name="name" placeholder="Bot-Name"><input name="host" placeholder="Minecraft Host"><input name="port" type="number" value="25565"><input name="username" placeholder="Minecraft Username"><input name="version" placeholder="Version optional"><input name="bind_ip" placeholder="VPS-IP optional"><button>Bot erstellen</button></form><p id="botMsg"></p></section><h3>Meine Bots</h3><div id="bots"></div><h3>Live-Konsole</h3><pre id="logs"></pre><form id="chat"><select name="id" id="botSelect"></select><input name="message" maxlength="200" placeholder="Chatnachricht"><button>Senden</button></form></section></main><script src="/app.js"></script></html>
